<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Erik Berlin, résumé</title>
    <meta name="description" content="Résumé of Erik Berlin (@sferik), software engineer in San Francisco." />
    <meta name="author" content="Erik Berlin" />
    <link rel="canonical" href="https://sferik.com/resume" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="service-desc" href="/openapi.json" type="application/openapi+json" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/site.css" />
    <script type="module" src="/site.js"></script>
    <style>
      /* Formatted like a man page, because that's how engineers read documentation. */
      .man-head,
      .man-foot {
        display: flex;
        justify-content: space-between;
        gap: 2ch;
      }
      .man-head > :nth-child(2),
      .man-foot > :nth-child(2) {
        text-align: center;
      }
      .man-head {
        margin-bottom: 1.5lh;
      }
      .man-foot {
        margin-top: 2lh;
      }
      .man h2 {
        margin-top: 1.5lh;
        letter-spacing: 0.04em;
      }
      .man .body {
        margin-left: 7ch;
      }
      .man .body > p + p {
        margin-top: 1lh;
      }
      .jobs > li,
      .entries > li {
        display: grid;
        grid-template-columns: 11ch minmax(0, 1fr);
        column-gap: 2ch;
        break-inside: avoid;
      }
      .jobs > li + li {
        margin-top: 0.75lh;
      }
      .jobs .when,
      .entries .when {
        color: var(--dim);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .jobs .role {
        font-weight: 700;
      }
      .jobs ul {
        margin-top: 0.15lh;
      }
      .jobs ul li,
      .oss li {
        padding-left: 2ch;
        text-indent: -2ch;
      }
      .jobs ul li::before,
      .oss li::before {
        content: "- ";
        color: var(--dim);
      }
      .opt {
        font-weight: 700;
      }
      .print-btn {
        font: inherit;
        color: var(--link);
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }
      .print-btn:hover {
        background: var(--link);
        color: var(--paper);
        text-decoration: none;
      }
      .toolbar {
        margin-bottom: 2lh;
      }

      @media (max-width: 560px) {
        .man .body {
          margin-left: 2ch;
        }
        .jobs > li,
        .entries > li {
          grid-template-columns: 1fr;
        }
        .man-head > :nth-child(2),
        .man-foot > :nth-child(2) {
          display: none;
        }
      }

      @page {
        size: letter;
        margin: 0.55in 0.6in 0.6in;
        @bottom-right {
          content: counter(page) " of " counter(pages);
          font:
            7.5pt ui-monospace,
            "SF Mono",
            Menlo,
            monospace;
          color: #6e6e73;
        }
      }
      @media print {
        :root,
        :root[data-theme] {
          --paper: #fff;
          --ink: #000;
          --dim: #555;
          --faint: #999;
          --rule: #ccc;
          --link: #000;
        }
        html,
        body {
          background: #fff !important;
          text-shadow: none !important;
        }
        body {
          font-size: 8.6pt;
          line-height: 1.38;
        }
        .screen {
          max-width: none;
          padding: 0;
        }
        .toolbar {
          display: none;
        }
        a {
          text-decoration: none;
        }
        .man h2 {
          margin-top: 1.05lh;
          break-after: avoid;
        }
        .man-head {
          margin-bottom: 0.6lh;
        }
        .man-foot {
          margin-top: 1lh;
        }
        .jobs > li + li {
          margin-top: 0.45lh;
        }
        .man .body {
          margin-left: 5ch;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <div class="scroller" data-scroller tabindex="-1">
      <main class="screen man" id="main" data-page="resume" aria-busy="true">
        <div class="toolbar">
          <p>
            <span class="prompt" aria-hidden="true"><span class="p-user">sferik</span>@mbp <span class="p-cwd">~</span>&gt; </span
            ><button class="print-btn" type="button" onclick="print()">lpr resume.html</button> <span class="faint">to print it</span>
          </p>
          <p class="dim">
            Also as <a href="/resume.pdf">PDF</a>, <a href="/resume.tex">LaTeX</a>, <a href="/resume.json">JSON</a>, or <a href="/resume.txt">plain text</a>.
          </p>
        </div>
        <noscript
          ><p>
            This page builds itself from its own API, which needs JavaScript. Without it, try <code>curl sferik.com/resume</code>, or read
            <a href="/resume.txt">the resume as text</a>.
          </p></noscript
        >
      </main>
    </div>

    <nav class="tmux" aria-label="Site">
      <span class="left"
        ><span class="session">[sferik]</span><a href="/">0:home</a><a href="/talks">1:talks</a><a href="/resume" aria-current="page">2:resume</a></span
      >
      <span class="right"><span class="host">"sferik.com" </span><span data-clock></span></span>
    </nav>

    <aside class="help" data-help hidden aria-label="Keyboard shortcuts">
      <dl>
        <dt><kbd>g h</kbd></dt>
        <dd>home</dd>
        <dt><kbd>g t</kbd></dt>
        <dd>talks</dd>
        <dt><kbd>g r</kbd></dt>
        <dd>resume</dd>
        <dt><kbd>j k</kbd></dt>
        <dd>scroll</dd>
        <dt><kbd>d</kbd></dt>
        <dd>dark or light</dd>
        <dt><kbd>?</kbd></dt>
        <dd>this help</dd>
      </dl>
    </aside>
  </body>
</html>
