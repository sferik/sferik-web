# Refreshes the snapshots in data/: the GitHub contribution graph, and each
# project's downloads and stars. The site shows live numbers; these are only
# shown when RubyGems or GitHub can't be reached (and, on Workers, until the
# first refresh after a deploy), so they just need to be reasonably recent.
name: Refresh snapshots

on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # Node runs the script as it is (type stripping), so there's nothing to install.
      - name: Refresh downloads, stars, and contributions
        run: node scripts/snapshot.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json data/projects.json
          git commit -m "Refresh snapshots"
          git push
