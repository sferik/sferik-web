# Lint, type-check, and test every push and pull request. The jobs run in
# parallel; any one failing fails the run. Both test suites also fail below
# 100% coverage. Bun installs the packages and runs the scripts; Node runs the
# server and its tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Bundle the Cloudflare Worker, without deploying it
        run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"

  server:
    name: Server tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26] # the oldest supported (package.json says >=24.2) and the newest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # With tectonic installed, the tests also compile the LaTeX resume and
      # fail on any TeX warning. Its package cache saves downloads between runs.
      - uses: wtfjoke/setup-tectonic@v4
      - uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ hashFiles('src/server.ts') }}
          restore-keys: tectonic-
      - run: bun run test:server

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - name: Upload the coverage report and any failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            coverage/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
